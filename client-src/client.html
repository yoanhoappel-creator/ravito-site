<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08080A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RAVITO" />
    <link rel="apple-touch-icon" href="./icons/ravito-public-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="description" content="Découvre les plats des restaurants partenaires RAVITO à Port-Gentil et commande simplement." />
    <meta name="robots" content="index, follow" />
    <title>RAVITO — Repas et livraison à Port-Gentil</title>
    <style>
      /* Écran visible immédiatement, avant même que l'application soit chargée */
      html,body{margin:0;background:#08080A;color:#F4F1EA;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
      #boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
      #boot img{width:96px;height:96px;border-radius:22px;animation:bootPulse 1.6s ease-in-out infinite}
      #boot p{margin:18px 0 0;color:#C9C5BC;font-size:1rem}
      @keyframes bootPulse{0%,100%{transform:scale(.96);filter:brightness(.9)}50%{transform:scale(1.04);filter:brightness(1.1)}}
      @media (prefers-reduced-motion:reduce){#boot img{animation:none}}
    </style>
  </head>
  <body>
    <div id="root"><div id="boot" role="status"><div><img src="./icons/ravito-public-192.png" alt="RAVITO" width="96" height="96" /><p>RAVITO se prépare…</p></div></div></div>
    <script type="module" src="/src/client-main.jsx"></script>
  </body>
</html>
