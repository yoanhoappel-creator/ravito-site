# Construit l'application client RAVITO (version statique) et la place dans /app, publié par GitHub Pages.
# Se lance tout seul quand le code de client-src change (ou à la main : Actions → Run workflow).
# Aucun secret : l'application n'appelle que les routes PUBLIQUES du serveur.
name: RAVITO - construire l'application client
on:
  push:
    branches: [main]
    paths: ["client-src/**", ".github/workflows/build-client.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: build-client
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer
        working-directory: client-src
        run: npm install --no-audit --no-fund
      - name: Construire
        working-directory: client-src
        run: npm run build
      - name: Vérifier le résultat
        run: |
          test -s client-src/dist/index.html
          test -s client-src/dist/manifest.webmanifest
          test -s client-src/dist/service-worker.js
          ls client-src/dist/assets | head
          grep -q "ravito-staff-app.onrender.com" client-src/dist/assets/*.js
      - name: Mettre à jour /app (les grosses images restent en place)
        run: |
          rm -rf app/assets
          cp -r client-src/dist/. app/
      - name: Publier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then echo "Aucun changement"; else git commit -m "Application client : reconstruction automatique" && git pull --rebase origin main && git push origin HEAD:main; fi
