# Veille d'Hermès : DORMANTE par défaut. Elle ne fait rien (aucun appel, le serveur gratuit reste libre de dormir)
# tant que la variable de dépôt HERMES_ACTIF n'est pas égale à « true »
# (GitHub → Settings → Secrets and variables → Actions → Variables). Aucun secret.
# Une fois activée, elle appelle le serveur toutes les 10 minutes en journée, du lundi au vendredi seulement (rien le week-end, pour économiser les heures gratuites) : cela fait tourner Hermès (s'il est aussi activé
# dans Réglages) et empêche le serveur gratuit de s'endormir. Pour arrêter : supprimer la variable ou la mettre à « false ».
name: RAVITO - veille en journée
on:
  schedule:
    - cron: "*/10 5-20 * * 1-5"   # toutes les 10 minutes, de 06h à 21h à Port-Gentil (UTC+1), du lundi au vendredi seulement
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: ravito-veille
  cancel-in-progress: true
jobs:
  veille:
    if: ${{ vars.HERMES_ACTIF == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Appeler le serveur RAVITO
        run: |
          curl -fsS -X POST --max-time 90 --retry 2 --retry-delay 15 --retry-all-errors \
            https://ravito-staff-app.onrender.com/api/cron/hermes
